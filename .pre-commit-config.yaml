repos:
  - repo: local
    hooks:
      - id: ruff-fix
        name: ruff-fix
        entry: python -m ruff check --fix .
        language: system
        pass_filenames: false

      - id: ruff-format
        name: ruff-format
        entry: python -m ruff format .
        language: system
        pass_filenames: false

      - id: black
        name: black
        entry: python -m black .
        language: system
        pass_filenames: false