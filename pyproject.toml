[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-project"
version = "0.1.0"
description = "LangChain research assistant project"
requires-python = ">=3.8"
dependencies = [
    "langchain-core",
    "langchain-community",
    "langchain-openai",
    "langgraph",
    "chromadb",
    "langchain_chroma",
    "pypdf",
    "python-dotenv",
    "sqlalchemy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]
local = [
    "langchain-huggingface",
    "sentence-transformers",
]
markdown = [
    "unstructured",
]
tools = [
    "certifi",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]
