[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-project"
version = "0.1.0"
description = "LangChain research assistant project"
requires-python = ">=3.8"
dependencies = [
    "langchain-core",
    "langchain-community",
    "langchain-openai",
    "langgraph",
    "chromadb",
    "langchain_chroma",
    "pypdf",
    "python-dotenv",
    "sqlalchemy",
    "fastapi",
    "sentence-transformers",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "httpx",
]
local = [
    "langchain-huggingface",
]
markdown = [
    "unstructured",
]
tools = [
    "certifi",
]
training = [
    "datasets",
    "accelerate",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "slow: exercises a real model download/training run, not mocked",
]