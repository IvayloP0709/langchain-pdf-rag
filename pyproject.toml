[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-project"
version = "0.1.0"
description = "LangChain research assistant project"
requires-python = ">=3.8"
dependencies = [
    "langchain",
    "langchain-core",
    "langchain-community",
    "langchain-openai",
    "langgraph",
    "chromadb",
    "langchain-pinecone",
    "pinecone-client",
    "pypdf",
    "unstructured",
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-dotenv",
    "sqlalchemy",
    "langchain-huggingface",
    "sentence-transformers",
    "certifi"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]
